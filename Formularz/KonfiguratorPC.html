<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Konfigurator PC</title>
</head>
<body>
    <h1>Konfigurator PC</h1>
    <br>
    <h2>Twoje dane</h2>
    <form>
        <label for="name">Imie</label>
        <input id="name" placeholder="Jan" required>
        <br>
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <br>
        <label for="birthday">Data urodzenia</label>
        <input type="date" id="birthday" required>
        <hr>
        <br>
        <h2>Konfiguracja</h2>
        <br>
        <label for="zastosowania">Główne zastosowania</label>
        <select id="zastosowania">
            <option value="Granie">Granie</option>
            <option value="Praca biurowa">Praca biurowa</option>
            <option value="Praca kreatywna">Praca kreatywna</option>
        </select>
        <br>
        <label for="budżet">Budżet</label>
        <input type="number" id="budżet" required min="0" max="10000">
        <br>
        <h3>Stan części:</h3>
        <label for="new">Nowe</label>
        <input type="checkbox" id="new">
        <br>
        <label for="used">Używane</label>
        <input type="checkbox" id="used">
        <br>
        <label for="outlet">Outlet (powystawowe, po zwrocie)</label>
        <input type="checkbox" id="outlet">
        <br>
        <h3>Co jest dla ciebie najważniejsze?</h3>
        <label for="lowprice">Niska cena</label>
        <input type="radio" id="lowprice" name="w">
        <br>
        <label for="performance">Wydajność</label>
        <input type="radio" id="performace" name="w">
        <br>
        <label for="looks">Wygląd</label>
        <input type="radio" id="looks" name="w">
        <br>
        <label for="kp">Kultura pracy</label>
        <input type="radio" id="kp" name="w">
        <br>
        <br>
        <input type="submit">
        <input type="reset">
    </form>

</body>
</html>
