        <style>
            h3 {
                margin: 0;
            }

            #heading {
                background-color: rgb(210, 194, 168);
                padding: 20px;
                text-decoration: none;
                color: black;
                font-size: 1.5em;
                font-weight: bold;
                font-family: serif;
            }

            #heading a:hover {
                color: rgb(68, 39, 26);
            }

            #heading a {
                text-decoration: none !important;
                color: black !important;
            }

            #heading a:visited {
                color: black !important;
            }

            #heading a:hover {
                color: rgb(68, 39, 26) !important;
                text-decoration: none !important;
            }

            #heading a:active {
                color: black !important;
                text-decoration: none !important;
            }

            #main {
                display: flex;
                align-items: stretch;
            }

            #nav {
                width: 220px;
                padding: 20px;
                background-color: rgb(210, 194, 168);
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            #nav a {
                display: block;
                text-decoration: none;
            }

            #nav button {
                width: 100%;
                padding: 12px;
                border: none;
                border-radius: 12px;
                background-color: rgb(245, 245, 240);
                color: rgb(68, 39, 26);
                font-size: 15px;
                font-weight: bold;
                cursor: pointer;
                transition: all 0.25s ease;
                box-shadow: 0 3px 8px rgba(0,0,0,0.15);
            }

            #nav button:hover {
                background-color: rgb(68, 39, 26);
                color: white;
                transform: translateX(5px);
                box-shadow: 0 6px 14px rgba(0,0,0,0.25);
            }

            #nav button:active {
                transform: scale(0.98);
            }

            #content {
                flex-grow: 1;
                padding: 20px;
                background-color: rgb(245, 245, 240);
                color: rgb(68, 39, 26);
            }

            #footer {
                padding: 20px;
                background-color: rgb(210, 194, 168);
                text-align: center;
            }

            body {
                margin: 0;
                padding: 0;
            }

            /* Tablet i telefon */
            @media (max-width: 768px) {

                #main {
                    flex-direction: column;
                }

                #nav {
                    width: auto;
                    padding: 15px;
                }

                #content {
                    padding: 15px;
                    min-height: auto;
                }

                #heading {
                    text-align: center;
                }

                #nav button {
                    font-size: 16px;
                    padding: 14px;
                }
            }

            html, body {
                height: 100%;
                margin: 0;
            }

            #container {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            #main {
                flex: 1;
                display: flex;
                align-items: stretch;
            }

            #content {
                flex: 1;
            }
        </style>
    </head>
