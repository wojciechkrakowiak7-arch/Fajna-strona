<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wyślij swoją pracę!</title>

    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 40px 20px;
        min-height: 100vh;

        font-family: Arial, sans-serif;
        color: #4a382b;

        background: #eee3d3;
    }

    form {
        max-width: 700px;
        margin: 0 auto;
        padding: 40px;

        background: #faf5ec;

        border: 1px solid #d4bea0;
        border-radius: 18px;

        box-shadow: 0 8px 25px rgba(70, 45, 30, 0.15);
    }

    label {
        font-weight: 600;
        color: #513d2e;
    }

    input,
    textarea,
    button {
        font-family: inherit;
    }

    /* Pola tekstowe */

    input:not([type="radio"]):not([type="checkbox"]):not([type="file"]):not([type="submit"]):not([type="reset"]) {
        width: 100%;
        margin-top: 7px;
        padding: 11px 13px;

        background: #fffdf9;

        border: 1px solid #cdb89b;
        border-radius: 8px;

        font-size: 15px;
    }

    input:focus,
    textarea:focus {
        outline: none;
        border-color: #987253;

        box-shadow: 0 0 0 3px rgba(152, 114, 83, 0.15);
    }

    /* Płeć */

    #plec {
        margin-top: 8px;
        padding: 8px 0;
    }

    #plec th {
        padding-right: 30px;
        font-weight: normal;
    }

    #plec label {
        margin-right: 5px;
    }

    input[type="radio"],
    input[type="checkbox"] {
        accent-color: #145adb;
        cursor: pointer;
    }

    /* Wybór pliku */

    input[type="file"] {
        display: block;
        width: 100%;

        margin-top: 10px;
        padding: 12px;

        background: #f3e8d8;

        border: 1px dashed #b49772;
        border-radius: 8px;
    }

    input[type="file"]::file-selector-button {
        padding: 9px 15px;
        margin-right: 12px;

        background: #d8c0a0;
        color: #463326;

        border: none;
        border-radius: 6px;

        font-weight: bold;
        cursor: pointer;
    }

    input[type="file"]::file-selector-button:hover {
        background: #c9aa83;
    }

    /* Regulamin */

    a button {
        padding: 10px 20px;

        background: transparent;
        color: #704936;

        border: 1px solid #704936;
        border-radius: 7px;

        font-weight: bold;
        cursor: pointer;

        transition: 0.2s;
    }

    a button:hover {
        background: #704936;
        color: white;
    }

    /* Pole podpisu */

    textarea {
        width: 100%;
        max-width: 100%;
        padding: 12px;

        background: #fffdf9;

        border: 1px solid #cdb89b;
        border-radius: 8px;

        resize: vertical;
    }

    /* Prześlij i wyczyść */

    input[type="submit"],
    input[type="reset"] {
        padding: 11px 24px;
        margin-right: 8px;

        border: none;
        border-radius: 8px;

        font-size: 15px;
        font-weight: bold;

        cursor: pointer;
        transition: 0.2s;
    }

    input[type="submit"] {
        background: #704936;
        color: white;
    }

    input[type="submit"]:hover {
        background: #563629;
        transform: translateY(-1px);
    }

    input[type="reset"] {
        background: #dfcdb5;
        color: #49372a;
    }

    input[type="reset"]:hover {
        background: #cdb596;
    }

    /* TELEFON */

    @media (max-width: 600px) {
        body {
            padding: 20px 12px;
        }

        form {
            padding: 25px 18px;
        }

        #plec th {
            padding-right: 12px;
        }

        input[type="submit"],
        input[type="reset"] {
            width: 100%;
            margin: 5px 0;
        }
    }
</style>
</head>
<body>
    <h1 align="center">Formularz przesyłania materiałów edukacyjnych</h1>
    <form>
        
        <label for="name" >Imię:</label>
        <input id="name" required>
        <br><br>
        <label for="surname">Nazwisko:</label>
        <input id="surname" required>
        <br><br>
        <label for="data urodzenia">Data urodzenia:</label>
        <input id="data urodzenia" type="date" required>
        <br><br>
        <label for="email adress">Adres Email:</label>
        <input id="email adress" type="email" required>
        <br><br>
        <label for="plec">Płeć:</label>
        <table border="0px" id="plec">
            <tr>
                <th>
                    <label for="male">Mężczyzna</label>
                    <input id="male" type="radio" value="male" name="X">
                </th>
                <th>
                    <label for="female">Kobieta</label>
                    <input id="female" type="radio" value="female" name="X">
                </th>
            </tr>
        </table>
        <br><br>
        <label for="plik">Załącz plik (.pdf, .docx, .txt, .pptx) z dysku</label>
        <input id="plik" type="file" required accept=".pdf, .docx, .txt, .pptx">
        <br><br>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

        <a href="Regulamin/Regulamin.pdf" title="Regulamin" download class="download"><i class="fa-solid fa-file-pdf"></i>Regulamin</a>

        <style>
        .download{
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:10px 18px;
            background:#704936;
            color:#fff;
            text-decoration:none;
            border-radius:6px;
            font-family:Arial,sans-serif;
            }

        .download:hover{
            background:#463326;
            }
        </style>
        
        <br><br>
        <label for="zgoda_na_warunki_regulaminu">Oznajmiam, iż zapoznałem/zapoznałam się z powyższym dokumentem i wyrażam zgodę na wymienione w nim warunki</label>
        <input type="checkbox" id="zgoda_na_warunki_regulaminu" required>
        <br><br>
        <label for="podpis">Napisz jak chcesz zostać podpisany/podpisana na swojej pracy:</label>
        <br><br>
        <textarea id="podpis" rows="8" cols="32"></textarea>
         <br>
            <p align="center">(UWAGA! W pliku .PDF prosimy o dodanie podpisu bezpośrednio w pliku. Dla pozostałych formatów brak wpisu oznacza brak podpisu na pracy.)</p>
        <br><br>
        <input value="Prześlij" type="submit">
        <input value="Zresetuj" type="reset">
    </form>
</body>
</html>
